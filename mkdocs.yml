site_name: HyDAMO Validatiehandboek
site_description: Documentatie voor de HyDAMO Validatietool, validatieregels en ondersteunende bestanden.
repo_url: https://github.com/HetWaterschapshuis/HyDAMOValidatiehandboek
repo_name: HetWaterschapshuis/HyDAMOValidatiehandboek

theme:
  name: material
  font:
    text: Asap
    code: Roboto Mono
  language: nl
  favicon: assets/favicon-hwh-logo-01.png
  logo: assets/favicon-hwh-logo-01.png
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
    - navigation.footer
  palette:
    - scheme: default
      primary: blue
      accent: orange

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false

copyright: Copyright &copy; 2026 het Waterschapshuis

extra_css:
  - stylesheets/extra.css

nav:
  - Home: "HyDAMO Validatietool/01 HyDAMO Validatietool.md"
  - Introductie tool:
      - In een oogopslag: "HyDAMO Validatietool/Introductie tool/01 In een oogopslag.md"
      - Validatieregels: "HyDAMO Validatietool/Introductie tool/02 Validatieregels.md"
      - Known issues en tips: "HyDAMO Validatietool/Introductie tool/03 Known issues en tips.md"
      - Versie overzicht: "HyDAMO Validatietool/Introductie tool/04 Versie overzicht.md"
  - Aan de slag:
      - Gebruikersregistratie: "HyDAMO Validatietool/Aan de slag/01 Gebruikersregistratie.md"
      - De Webclient: "HyDAMO Validatietool/Aan de slag/02 De Webclient.md"
      - De API: "HyDAMO Validatietool/Aan de slag/03 De API.md"
      - De Validatiemodule: "HyDAMO Validatietool/Aan de slag/04 De Validatiemodule.md"
      - Resultaten interpreteren: "HyDAMO Validatietool/Aan de slag/05 Resultaten interpreteren.md"
  - Ondersteuning:
      - Contact en gebruikers: "HyDAMO Validatietool/Ondersteuning/01 Contact en gebruikers.md"
