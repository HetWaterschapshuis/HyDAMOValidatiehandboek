name: Deploy GitHub Pages

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Checkout merged base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build virtual environment
        run: uv venv

      - name: Inspect venv2
        run: |
          ls -la .venv
          ls -la .venv/bin

      - name: Sync dependencies
        run: uv pip install --python .venv/bin/python -r requirements.txt

      - name: Show installed packages2
        run: .venv/bin/python

      - name: Build MkDocs site
        run: .venv/bin/mkdocs build --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
